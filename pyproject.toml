[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cubex"
version = "0.5.0"
description = "Reusable tools for hyperspectral and thermal imaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "Pillow>=9.5", "spectral>=0.23"]

[project.optional-dependencies]
video = ["av>=12"]
dev = ["pytest>=8", "build>=1", "setuptools>=68", "wheel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cubex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest"
